
global
    log stdout format raw local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend http_front
    bind *:80
    default_backend nginx_backend

backend nginx_backend
    balance roundrobin
    option httpchk GET /health
    server nginx nginx:80 check resolvers docker init-addr libc,none
