
name: secure-multi-layer-proxy

services:

  squid:
    image: ubuntu/squid:latest
    container_name: squid-forward-proxy
    restart: unless-stopped
    volumes:
      - ./configs/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./logs/squid:/var/log/squid
    networks:
      proxy_egress:
        gw_priority: 1
      internal_users_net:
        ipv4_address: 172.30.30.10

  proxy-test:
    image: curlimages/curl:8.12.1
    container_name: proxy-test
    entrypoint: ["curl"]
    networks:
      - internal_users_net

  haproxy:
    image: haproxy:3.2-alpine
    container_name: haproxy-load-balancer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./configs/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      edge_net:
        gw_priority: 1
      gateway_net: {}

  
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    volumes:
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gateway_net

  
  kong:
    image: kong:3.9.1
    container_name: kong-api-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: notice
    volumes:
      - ./configs/kong/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - gateway_net
      - backend_net


  users:
    build: ./services/users
    container_name: users-service
    restart: unless-stopped
    networks:
      - backend_net

  orders:
    build: ./services/orders
    container_name: orders-service
    restart: unless-stopped
    networks:
      - backend_net

  payments:
    build: ./services/payments
    container_name: payments-service
    restart: unless-stopped
    networks:
      - backend_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring_net

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net


networks:

  edge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

  gateway_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24

  internal_users_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24

  backend_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.40.0/24

  proxy_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.50.0/24
    
  monitoring_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: